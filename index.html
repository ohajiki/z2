<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div class="hamburger-menu">
            <button>
                <span></span>
                <span></span>
                <span></span>
            </button>
            <p>MENU</p>
        </div>
        <div class="point-list">
            <img src="point-img">
            <div class="point-card">
                <div class="point-up">
                    <div class="point-left">
                        <p>現在のポイント</p>
                        <div class="point-now">8/10pt</div>
                        <div class="point-progress"></div>
                    </div>
                    <div class="point-right">
                        <p>あと〇ポイントで50円引き！</p>
                        <div class="arrow"></div>
                    </div>
                </div>
                <div class="point-down">
                    <img src="">
                    <p>会計時にこの画面を提示する</p>
                </div>
            </div>
        </div>
        <div class="button-list">
            <div class="button-card card-menu">
                <div class="card-up">
                    <img src="images/hasami.jpg">
                </div>
                <div class="card-icon">
                    <img src="images/scissors.png">
                </div>
                <div class="card-down">
                    <div class="card-word">
                        <h2>料金・メニュー</h2>
                        <p>MENU / PRICE</p>
                    </div>
                    <div class="arrow"></div>
                </div>
            </div>
            <div class="button-card card-time">
                <div class="card-up">
                    <img src="images/time.jpeg">
                </div>
                <div class="card-icon">
                    <img src="images/clock.png">
                </div>
                <div class="card-down">
                    <div class="card-word">
                        <h2>営業時間・定休日</h2>
                        <p>OPEN / CLOSE</p>
                    </div>
                    <div class="arrow"></div>
                </div>
            </div>
            <div class="button-card card-schedule">
                <div class="card-up">
                    <img src="images/carender.jpg">
                </div>
                <div class="card-icon">
                    <img src="images/calendar.png">
                </div>
                <div class="card-down">
                    <div class="card-word">
                        <h2>今月の出勤情報</h2>
                        <p>SCHEDULE</p>
                    </div>
                    <div class="arrow"></div>
                </div>
            </div>
            <div class="button-card card-coupon">
                <div class="card-up">
                    <img src="images/coupon.jpg">
                </div>
                <div class="card-icon">
                    <img src="images/ticket.png">
                </div>
                <div class="card-down">
                    <div class="card-word">
                        <h2>クーポン</h2>
                        <p>COUPON</p>
                    </div>
                    <div class="arrow"></div>
                </div>
            </div>
            <div class="button-card card-news">
                <div class="card-up">
                    <img src="images/sora.jpg">
                </div>
                <div class="card-icon">
                    <img src="images/megaphone.png">
                </div>
                <div class="card-down">
                    <div class="card-word">
                        <h2>お知らせ</h2>
                        <p>NEWS</p>
                    </div>
                    <div class="arrow"></div>
                </div>
            </div>
            <div class="button-card">
                <div class="card-up">
                    <img src="">
                </div>
                <div class="card-down">
                    <div class="card-word">
                        <h2></h2>
                        <p></p>
                    </div>
                    <div class="arrow"></div>
                </div>
            </div>
        </div>
        <div class="menu-bar">
            <div class="home-button">
                <img src="" alt="">
            </div>
            <div class="point-button"></div>
            <div class="menu-button"></div>
            <div class="time-button"></div>
            <div class="notice-button"></div>
        </div>
        <img src="images/hero.jpg" class="hero-img">
    </main>
</body>
</html>
